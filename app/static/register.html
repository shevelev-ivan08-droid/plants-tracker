<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Трекер полива</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Регистрация</h2>
        <div id="error-msg" class="message error hidden"></div>
        <form id="register-form">
            <div class="form-group">
                <label for="username">Логин (мин. 3 символа)</label>
                <input type="text" id="username" name="username" required minlength="3">
            </div>
            <div class="form-group">
                <label for="password">Пароль (мин. 6 символов)</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-full">Зарегистрироваться</button>
        </form>
        <p class="text-center mt-20">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </p>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
